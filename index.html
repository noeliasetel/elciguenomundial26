<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Animación AR</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; width: 100vw; height: 100vh; }

    #camara {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover; z-index: 0;
    }

    #video-src {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: contain;
      z-index: 1;
      pointer-events: none;
      mix-blend-mode: screen;
    }

    #overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.88);
      color: #fff; display: flex;
      flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 10; font-family: sans-serif;
      text-align: center; padding: 2rem; gap: 1.5rem;
    }
    #overlay h2 { font-size: 1.5rem; }
    #overlay p  { font-size: 1rem; opacity: 0.8; }
    #btn {
      padding: 1rem 2.5rem; font-size: 1.2rem;
      background: #00cc44; color: #fff;
      border: none; border-radius: 2rem;
      cursor: pointer; font-weight: bold;
    }
  </style>
</head>
<body>

  <video id="camara" autoplay playsinline muted></video>

  <video id="video-src"
    src="video.mp4"
    playsinline
    muted
    loop
    preload="auto"
    webkit-playsinline>
  </video>

  <div id="overlay">
    <h2>✨ Realidad Aumentada</h2>
    <p>Pulsa para activar la cámara y ver la animación</p>
    <button id="btn">▶ Iniciar AR</button>
  </div>

  <script>
    const btn      = document.getElementById('btn');
    const overlay  = document.getElementById('overlay');
    const camVideo = document.getElementById('camara');
    const srcVideo = document.getElementById('video-src');

    btn.addEventListener('click', async () => {
      overlay.style.display = 'none';

      // Vídeo primero
      srcVideo.muted = true;
      try { await srcVideo.play(); } catch(e) { console.error(e); }

      // Cámara después
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: 'environment' } },
          audio: false
        });
        camVideo.srcObject = stream;
        await camVideo.play();
      } catch(e) { console.warn(e); }
    });
  </script>
</body>
</html>
