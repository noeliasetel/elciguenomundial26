<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Animación AR</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; width: 100vw; height: 100vh; }

    #camara {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover; z-index: 0;
    }
    #canvas-ar {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 1; pointer-events: none;
    }
    #video-src { display: none; }

    #overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.88);
      color: #fff; display: flex;
      flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 10; font-family: sans-serif;
      text-align: center; padding: 2rem; gap: 1.5rem;
    }
    #overlay h2 { font-size: 1.5rem; }
    #overlay p  { font-size: 1rem; opacity: 0.8; }
    #btn {
      padding: 1rem 2.5rem; font-size: 1.2rem;
      background: #00cc44; color: #fff;
      border: none; border-radius: 2rem;
      cursor: pointer; font-weight: bold;
      box-shadow: 0 4px 20px rgba(0,200,60,0.4);
    }
  </style>
</head>
<body>

  <video id="camara" autoplay playsinline muted></video>
  <canvas id="canvas-ar"></canvas>
  <video id="video-src" src="video.mp4" playsinline loop muted preload="auto"></video>

  <div id="overlay">
    <h2>✨ Realidad Aumentada</h2>
    <p>Pulsa para activar la cámara y ver la animación</p>
    <button id="btn">▶ Iniciar AR</button>
  </div>

  <script>
    const btn      = document.getElementById('btn');
    const overlay  = document.getElementById('overlay');
    const camVideo = document.getElementById('camara');
    const srcVideo = document.getElementById('video-src');
    const canvas   = document.getElementById('canvas-ar');
    const ctx      = canvas.getContext('2d');

    let offscreen, octx;

    function resize() {
      canvas.width  = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    function removeGreen(imageData) {
      const d = imageData.data;
      for (let i = 0; i < d.length; i += 4) {
        const r = d[i];
        const g = d[i+1];
        const b = d[i+2];

        // Detecta verde: g es el canal dominante
        // Cubre verde puro #00ff00 y verdes claros
        if (g > 80 && g > r * 1.3 && g > b * 1.3) {
          // Suavizado en bordes según cuánto domina el verde
          const greenness = (g - Math.max(r, b)) / 255;
          d[i+3] = Math.max(0, Math.floor((1 - greenness * 2.5) * 255));
        }
      }
      return imageData;
    }

    function render() {
      requestAnimationFrame(render);
      if (srcVideo.readyState < 2) return;

      const vw = srcVideo.videoWidth;
      const vh = srcVideo.videoHeight;
      if (!vw || !vh) return;

      // Offscreen canvas para procesar píxeles
      if (!offscreen || offscreen.width !== vw || offscreen.height !== vh) {
        offscreen = document.createElement('canvas');
        offscreen.width  = vw;
        offscreen.height = vh;
        octx = offscreen.getContext('2d', { willReadFrequently: true });
      }

      // Dibujar frame del vídeo en offscreen
      octx.drawImage(srcVideo, 0, 0, vw, vh);

      // Eliminar fondo verde
      const imageData = octx.getImageData(0, 0, vw, vh);
      const processed = removeGreen(imageData);
      octx.putImageData(processed, 0, 0);

      // Calcular tamaño para cubrir pantalla manteniendo proporción
      const scale = Math.min(canvas.width / vw, canvas.height / vh);
      const drawW = vw * scale;
      const drawH = vh * scale;
      const dx = (canvas.width  - drawW) / 2;
      const dy = (canvas.height - drawH) / 2;

      // Limpiar y dibujar sobre cámara
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(offscreen, dx, dy, drawW, drawH);
    }

    btn.addEventListener('click', async () => {
      overlay.style.display = 'none';

      // Activar cámara trasera
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: 'environment' } },
          audio: false
        });
        camVideo.srcObject = stream;
        await camVideo.play();
      } catch (e) {
        console.warn('Cámara no disponible:', e);
      }

      // Reproducir vídeo
      srcVideo.muted = true;
      try {
        await srcVideo.play();
      } catch (e) {
        console.error('Error al reproducir vídeo:', e);
      }

      render();
    });
  </script>
</body>
</html>
