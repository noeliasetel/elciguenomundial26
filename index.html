<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <title>Animación AR sin Fondo</title>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>
<body style="margin: 0; overflow: hidden; -webkit-tap-highlight-color: transparent;">

    <a-scene embedded 
             vr-mode-ui="enabled: false" 
             arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;">
        
        <a-assets>
            <video id="video-ar" 
                   src="tu-video.webm" 
                   preload="auto" 
                   loop="true" 
                   autoplay="true" 
                   playsinline 
                   webkit-playsinline 
                   muted>
            </video>
        </a-assets>

        <a-marker preset="hiro">
            <a-video src="#video-ar" 
                     position="0 0 0" 
                     rotation="-90 0 0" 
                     width="1.6" 
                     height="0.9"
                     scale="2 2 2">
            </a-video>
        </a-marker>

        <a-entity camera></a-entity>

    </a-scene>

    <script>
        window.addEventListener('click', () => {
            const video = document.querySelector('#video-ar');
            if (video && video.paused) {
                video.play().catch(err => console.log("Error al reproducir:", err));
            }
        });
    </script>
</body>
</html>
