<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Animación AR</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; width: 100vw; height: 100vh; }
    #camara {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover; z-index: 0;
    }
    #canvas-ar {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 1; pointer-events: none;
    }
    #video-src { display: none; }
    #overlay-permiso {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.85);
      color: #fff; display: flex;
      flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 10; font-family: sans-serif;
      text-align: center; padding: 2rem; gap: 1.2rem;
    }
    #overlay-permiso h2 { font-size: 1.4rem; }
    #overlay-permiso p  { font-size: 1rem; opacity: 0.8; }
    #btn-iniciar {
      padding: 0.9rem 2.2rem; font-size: 1.1rem;
      background: #00cc44; color: #fff;
      border: none; border-radius: 2rem;
      cursor: pointer; font-weight: bold;
    }
  </style>
</head>

    <p>Pulsa el botón para activar la cámara y ver la animación</p>
    <button id="btn-iniciar">▶ Iniciar AR</button>
  </div>

      }

        } else {
          gl_FragColor = color;
        }
      }
