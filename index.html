<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Test AR</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #111; color: #fff; font-family: sans-serif; padding: 1rem; }
    #log { margin-top: 1rem; font-size: 0.85rem; line-height: 1.8; }
    #log p { border-bottom: 1px solid #333; padding: 4px 0; }
    .ok  { color: #00ff88; }
    .err { color: #ff4444; }
    button {
      margin-top: 1rem; padding: 0.8rem 2rem;
      background: #00cc44; color: #fff;
      border: none; border-radius: 1rem;
      font-size: 1rem; cursor: pointer;
    }
    video { display: none; }
  </style>
</head>
<body>
  <h2>🔍 Diagnóstico AR</h2>
  <button id="btn">Iniciar test</button>
  <div id="log"></div>
  <video id="vid" src="video.mp4" playsinline muted loop preload="auto"></video>

  <script>
    const log = document.getElementById('log');
    const vid = document.getElementById('vid');

    function msg(texto, ok) {
      const p = document.createElement('p');
      p.className = ok ? 'ok' : 'err';
      p.textContent = (ok ? '✅ ' : '❌ ') + texto;
      log.appendChild(p);
    }

    document.getElementById('btn').addEventListener('click', async () => {
      log.innerHTML = '';

      // 1. Cámara
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
        stream.getTracks().forEach(t => t.stop());
        msg('Cámara accesible', true);
      } catch(e) {
        msg('Cámara bloqueada: ' + e.message, false);
      }

      // 2. Vídeo carga
      msg('readyState del vídeo: ' + vid.readyState + ' (necesita 2+)', vid.readyState >= 2);
      msg('Src del vídeo: ' + vid.src, !!vid.src);

      // 3. Intentar play
      try {
        await vid.play();
        msg('Vídeo reproduce OK', true);
        msg('Duración: ' + vid.duration + 's', vid.duration > 0);
        msg('Tamaño: ' + vid.videoWidth + 'x' + vid.videoHeight, vid.videoWidth > 0);
      } catch(e) {
        msg('Vídeo NO reproduce: ' + e.message, false);
      }

      // 4. Canvas 2D
      try {
        const c = document.createElement('canvas');
        const ctx = c.getContext('2d', { willReadFrequently: true });
        ctx.drawImage(vid, 0, 0);
        ctx.getImageData(0, 0, 1, 1);
        msg('Canvas 2D + getImageData OK', true);
      } catch(e) {
        msg('Canvas 2D bloqueado: ' + e.message, false);
      }
    });
  </script>
</body>
</html>
